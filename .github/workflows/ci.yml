name: FitAI CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile backend/app/main.py backend/app/services/person_analyzer.py backend/app/services/camera_service.py
